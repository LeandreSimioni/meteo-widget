name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      # Le tag "latest" est glissant : il ne dit pas quelle version il contient.
      # UpdateChecker lit ces deux lignes dans le corps de la release pour savoir
      # si l'APK en ligne est plus récent que celui installé.
      - name: Read version from build.gradle.kts
        id: version
        run: |
          echo "code=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteo-widget-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: true
          body: |
            versionCode=${{ steps.version.outputs.code }}
            versionName=${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/debug/app-debug.apk
